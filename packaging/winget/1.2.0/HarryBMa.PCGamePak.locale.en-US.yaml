ReleaseNotes: |-
  A GamePak can now be started by any NFC card or barcode: tap or scan, and the
  launcher opens ready, with Play to start. A GamePak can be a game on another
  PC, started there on the tap and streamed with Moonlight on Play. Emulated
  games can be made into cartridges that carry their ROM, listed by Pegasus
  and ES-DE.

  The memory card is drawn as a card with its saves round it. The app and the
  wizard have new icons that read at taskbar size. Windows no longer opens an
  Explorer window beside the launcher when a cartridge goes in.

  WinGet installs the two executables and puts them on PATH. It cannot register
  the watcher's logon task, so a cartridge will not open its launcher on insert
  until you run the installer once:

    powershell -ExecutionPolicy Bypass -File install.ps1 -Mode Watcher

  install.ps1 ships in the windows\ folder of the installed package. The wizard
  needs none of that and works immediately:

    pc-gamepak --create
ReleaseNotesUrl: https://github.com/HarryBMa/pc-gamepak/releases/tag/v1.2.0

